<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register — Zee Tech Foundation</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <a
          class="brand"
          href="home.html"
          style="justify-content: center; margin-bottom: 1.5rem"
        >
          <img
            src="images/logo.png"
            alt="Zee Tech Foundation Logo"
            class="brand-logo"
          />
        </a>
        <h1>Create your account</h1>
        <p class="muted">
          Track donations or applications from your dashboard.
        </p>
        <form class="form mt-3" data-demo="Account created (demo)">
          <div class="field"><label>Full name</label><input required /></div>
          <div class="field">
            <label>Email</label><input type="email" required />
          </div>
          <div class="field">
            <label>I'm signing up as</label>
            <select required>
              <option value="">Select</option>
              <option>Donor</option>
              <option>Applicant</option>
              <option>Partner</option>
            </select>
          </div>
          <div class="field">
            <label>Password</label><input type="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Create account</button>
        </form>
        <p class="text-center mt-3 muted">
          Already have one? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
