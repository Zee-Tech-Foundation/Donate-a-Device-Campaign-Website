<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Apply for a Device — Zee Tech Foundation</title>
    <meta
      name="description"
      content="Students, educators and community programmes can apply here for a refurbished device."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div data-header></div>
    <main>
      <section class="form-bg form-bg-apply">
        <div class="container" style="max-width: 720px">
          <div class="form-intro reveal">
            <p class="eyebrow">Apply</p>
            <h1>Request a refurbished device.</h1>
            <p>
              We prioritise applicants based on need, community impact and
              available inventory.
            </p>
          </div>
          <div class="card reveal">
            <form
              class="form"
              data-demo="Application submitted. You'll receive an update within 2 weeks."
            >
              <div class="row-2">
                <div class="field">
                  <label>Full name</label><input required />
                </div>
                <div class="field">
                  <label>Age</label><input type="number" min="6" required />
                </div>
              </div>
              <div class="row-2">
                <div class="field">
                  <label>Email</label><input type="email" required />
                </div>
                <div class="field"><label>Phone</label><input required /></div>
              </div>
              <div class="field">
                <label>I am a…</label>
                <select required>
                  <option value="">Select</option>
                  <option>Student</option>
                  <option>Educator</option>
                  <option>Community programme</option>
                </select>
              </div>
              <div class="field">
                <label>School or organisation</label><input />
              </div>
              <div class="field">
                <label>Why do you need a device?</label
                ><textarea rows="5" required></textarea>
              </div>
              <div class="field">
                <label>Location</label
                ><input required placeholder="City, country" />
              </div>
              <div class="field field-check">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms"
                  >I agree to the
                  <a href="terms.html" target="_blank"
                    >Terms &amp; Conditions</a
                  >
                  and confirm the information above is accurate.</label
                >
              </div>
              <button class="btn btn-primary" type="submit">
                Submit application
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="main.js"></script>
  </body>
</html>
