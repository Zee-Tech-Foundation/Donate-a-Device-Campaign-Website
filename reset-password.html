<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Reset Password — Zee Tech Foundation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <a
          class="brand auth-brand"
          href="index.html"
          style="justify-content: center; margin-bottom: 1.5rem"
        >
          <img
            src="images/logo.png"
            alt="Zee Tech Foundation"
            class="brand-logo"
          />
        </a>

        <h1 class="text-center">Reset Password</h1>

        <p class="muted text-center">Create a new password for your account.</p>

        <form class="form mt-4" data-demo="Password updated successfully.">
          <div class="field">
            <label>New Password</label>

            <input type="password" id="newPassword" required />
          </div>

          <div class="field">
            <label>Confirm Password</label>

            <input type="password" id="confirmPassword" required />
          </div>

          <div class="field field-check">
            <input type="checkbox" id="showPassword" />

            <label for="showPassword"> Show Passwords </label>
          </div>

          <button class="btn btn-primary" type="submit">Reset Password</button>
        </form>

        <p class="text-center mt-3">
          <a href="login.html"> Return to Login </a>
        </p>
      </div>
    </div>

    <script>
      const checkbox = document.getElementById("showPassword");

      const newPassword = document.getElementById("newPassword");

      const confirmPassword = document.getElementById("confirmPassword");

      checkbox.addEventListener("change", function () {
        const type = this.checked ? "text" : "password";

        newPassword.type = type;

        confirmPassword.type = type;
      });
    </script>

    <script src="main.js"></script>
  </body>
</html>
