<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — Zee Tech Foundation</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <a
          class="brand"
          href="index.html"
          style="justify-content: center; margin-bottom: 1.5rem"
        >
          <span class="brand-mark">Z</span
          ><span class="brand-name">Zee Tech <span>Foundation</span></span>
        </a>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to your dashboard.</p>
        <form class="form mt-3" data-demo="Signed in (demo)">
          <div class="field">
            <label>Email</label><input type="email" required />
          </div>
          <div class="field">
            <label>Password</label><input type="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <p class="text-center mt-3 muted">
          No account? <a href="register.html">Register</a>
        </p>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
