<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Donate a Device — Zee Tech Foundation</title>
    <meta
      name="description"
      content="Donate your unused laptop, tablet or phone to a learner in need."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div data-header></div>
    <main>
      <section class="form-bg form-bg-donate">
        <div class="container" style="max-width: 720px">
          <div class="form-intro reveal">
            <p class="eyebrow">Donate</p>
            <h1>Turn your old device into a learner's future.</h1>
            <p>
              Fill in the form and we'll arrange collection or drop-off. All
              data is professionally wiped.
            </p>
          </div>
          <div class="card reveal">
            <form
              class="form"
              data-demo="Thanks — your donation has been logged. We'll be in touch to arrange pickup."
            >
              <div class="row-2">
                <div class="field">
                  <label>Full name</label><input required />
                </div>
                <div class="field">
                  <label>Email</label><input type="email" required />
                </div>
              </div>
              <div class="row-2">
                <div class="field"><label>Phone</label><input required /></div>
                <div class="field"><label>City</label><input required /></div>
              </div>
              <div class="row-2">
                <div class="field">
                  <label>Device type</label>
                  <select required>
                    <option value="">Select</option>
                    <option>Laptop</option>
                    <option>Tablet</option>
                    <option>Smartphone</option>
                    <option>Desktop</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="field">
                  <label>Number of devices</label
                  ><input type="number" min="1" value="1" required />
                </div>
              </div>
              <div class="field">
                <label>Condition &amp; notes</label
                ><textarea
                  rows="4"
                  placeholder="Age, condition, any accessories included…"
                ></textarea>
              </div>
              <div class="field">
                <label>Preferred handover</label>
                <select>
                  <option>Drop-off</option>
                  <option>Pickup</option>
                  <option>Ship</option>
                </select>
              </div>
              <div class="field field-check">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms"
                  >I agree to the
                  <a href="terms.html" target="_blank"
                    >Terms &amp; Conditions</a
                  >
                  and confirm I own this device and have removed personal data
                  (or authorise Zee Tech to wipe it).</label
                >
              </div>
              <button class="btn btn-primary" type="submit">
                Submit donation
              </button>
              <p class="hint" style="color: rgba(255, 255, 255, 0.9)">
                Prefer to talk first?
                <a
                  href="contact.html"
                  style="color: #fff; text-decoration: underline"
                  >Contact us</a
                >.
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="main.js"></script>
  </body>
</html>
